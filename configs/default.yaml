device: cuda
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  rmfrd_root: ../../datasets/rmfrd/AFDB
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  emb_dim: 512
  loss: cosface
train:
  protocol: full
  epochs: 8
  batch_size: 64
  lr: 0.05
  num_workers: 4
  seed: 42
  mask_aug_prob: 0.5
eval:
  batch_size: 64
  max_pairs: null
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  figure_dir: outputs/figures/full

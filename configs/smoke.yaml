device: cuda
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  rmfrd_root: ../../datasets/rmfrd/AFDB
  train_ratio: 0.7
  max_images: 2000
model:
  image_size: 112
  emb_dim: 128
  loss: cosface
train:
  protocol: smoke
  epochs: 1
  batch_size: 32
  lr: 0.05
  num_workers: 2
  seed: 42
  mask_aug_prob: 0.5
eval:
  batch_size: 32
  max_pairs: 200
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs/smoke
  figure_dir: outputs/figures/smoke
